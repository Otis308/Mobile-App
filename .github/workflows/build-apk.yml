name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "mobile_app/**"
      - "scripts/prepare_android.py"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Tuỳ chọn: đặt trong Settings > Secrets and variables > Actions > Variables
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SOCKET_URL: ${{ vars.SOCKET_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Repo không commit thư mục android/, nên sinh lại bằng template của Flutter
      # (vào thư mục tạm để không đụng tới lib/ và pubspec.yaml) rồi vá cấu hình.
      - name: Generate and patch Android project
        run: |
          if [ ! -d mobile_app/android ]; then
            flutter create --org com.workflow --project-name workflow_mobile \
              --platforms=android "$RUNNER_TEMP/scaffold"
            cp -R "$RUNNER_TEMP/scaffold/android" mobile_app/android
          fi
          python3 scripts/prepare_android.py mobile_app

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      # Không chặn build; chỉ để xem cảnh báo/lỗi gợi ý trong log.
      - name: Analyze
        working-directory: mobile_app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: mobile_app
        run: |
          ARGS=()
          if [ -n "$API_BASE_URL" ]; then ARGS+=("--dart-define=API_BASE_URL=$API_BASE_URL"); fi
          if [ -n "$SOCKET_URL" ]; then ARGS+=("--dart-define=SOCKET_URL=$SOCKET_URL"); fi
          flutter build apk --release "${ARGS[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
